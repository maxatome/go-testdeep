version: "2"
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
run:
  go: '1.16'
linters:
  default: none
  enable:
    - asasalint
    - asciicheck
    - bidichk
    - durationcheck
    - errcheck
    - gocritic
    - godot
    - govet
    - importas
    - ineffassign
    - misspell
    - prealloc
    - revive
    - staticcheck
    - testableexamples
    - unconvert
    - unused
    - wastedassign
    - whitespace
  settings:
    revive:
      rules:
        - name: unused-parameter
          disabled: true
  exclusions:
    rules:
      - path: internal/dark/bypass\.go
        text: const \w+ is unused
      # reflect.Ptr deprecated but still needed for older go
      - path: .
        text: 'inline: Constant reflect\.Ptr should be inlined'
      # reflect.PtrTo deprecated but still needed for go<1.18
      - path: .
        text: 'inline: cannot inline call to reflect\.PtrTo'
formatters:
  enable:
    - gci
    - goimports
  settings:
    gci:
      sections:
        - standard
        - default
        - localmodule
      custom-order: true
